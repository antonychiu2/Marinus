apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: opengrep-sast

on:
  push:
    branches:
      - "**"          # covers PR branches too; pull_request runs can't get an id-token
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

env:
  OPENGREP_VERSION: v1.30.0
  BLOCK_ON_HIGH: "false"   # "true" = fail the run when high-severity findings exist

jobs:
  opengrep:
    steps:
      - name: Check out source
        uses: cloudbees-io/checkout@v1

      - name: OpenGrep scan
        id: scan
        uses: docker://alpine:3.20
        shell: sh
        run: |
          set -eu
          export LANG=C.UTF-8 LC_ALL=C.UTF-8     # rules contain UTF-8; OpenGrep crashes without this
          apk add -q curl git jq

          curl -fsSL -o /usr/local/bin/opengrep \
            "https://github.com/opengrep/opengrep/releases/download/${OPENGREP_VERSION}/opengrep_musllinux_x86"
          chmod +x /usr/local/bin/opengrep
          git clone -q --depth 1 https://github.com/opengrep/opengrep-rules.git /tmp/rules

          cd "$CLOUDBEES_WORKSPACE"
          opengrep scan --config /tmp/rules/javascript --config /tmp/rules/python \
            --json --output /tmp/results.json .

          # Each file in $CLOUDBEES_OUTPUTS becomes a step output
          count() { jq "[.results[] | select(.extra.severity == \"$1\")] | length" /tmp/results.json; }
          printf %s "$(count ERROR)"   > "$CLOUDBEES_OUTPUTS/high"
          printf %s "$(count WARNING)" > "$CLOUDBEES_OUTPUTS/medium"
          printf %s "$(count INFO)"    > "$CLOUDBEES_OUTPUTS/low"
          jq -r '.results[:15][] | "| \(.extra.severity) | \(.check_id | split(".") | last) | `\(.path):\(.start.line)` |"' \
            /tmp/results.json > "$CLOUDBEES_OUTPUTS/findings"

      - name: Publish evidence
        if: ${{ always() }}
        uses: cloudbees-io/publish-evidence-item@v1
        with:
          content: |
            ## OpenGrep SAST

            | 🔴 High | 🟠 Medium | 🔵 Low |
            |:-:|:-:|:-:|
            | ${{ steps.scan.outputs.high }} | ${{ steps.scan.outputs.medium }} | ${{ steps.scan.outputs.low }} |

            ### Findings (first 15)
            | Severity | Rule | Location |
            |---|---|---|
            ${{ steps.scan.outputs.findings }}

            OpenGrep ${{ env.OPENGREP_VERSION }} · rules: javascript, python · run `${{ cloudbees.run_id }}`

      - name: Security gate
        uses: docker://alpine:3.20
        shell: sh
        run: |
          HIGH="${{ steps.scan.outputs.high }}"
          echo "High-severity findings: $HIGH (BLOCK_ON_HIGH=$BLOCK_ON_HIGH)"
          if [ "$BLOCK_ON_HIGH" = "true" ] && [ "$HIGH" -gt 0 ]; then
            echo "Blocked by security gate"; exit 1
          fi
